name: Near-real-time drought update

on:
  schedule:
    # Weekly. The job is incremental: weeks with no new Sentinel-2 / CHIRPS month change nothing.
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      period:
        description: 'Force one month (YYYY-MM). Leave empty to process whatever is due.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: realtime-drought-sync
  cancel-in-progress: false

jobs:
  realtime_sync:
    name: Ingest Sentinel-2 + CHIRPS, rescore villages, publish data
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements-realtime.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements-realtime.txt pytest

      - name: Pipeline regression tests
        run: python -m pytest scripts/tests -q

      - name: Check Earth Engine credentials
        env:
          GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
          GEE_PROJECT: ${{ vars.GEE_PROJECT || secrets.GEE_PROJECT }}
        run: |
          if [ -z "$GEE_PROJECT" ]; then
            echo "::error::Set the repository variable GEE_PROJECT (Settings > Secrets and variables > Actions > Variables) to your Earth Engine Cloud project id."
            exit 1
          fi
          if [ -z "$GEE_SERVICE_ACCOUNT_KEY" ]; then
            echo "::error::Secret GEE_SERVICE_ACCOUNT_KEY is not set. Add the JSON key of an Earth Engine-registered service account (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Run near-real-time update
        id: pipeline
        continue-on-error: true
        env:
          GEE_PROJECT: ${{ vars.GEE_PROJECT || secrets.GEE_PROJECT }}
          GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PERIOD: ${{ github.event.inputs.period }}
          # Run forward from this month (YYYY-MM); earlier months are never ingested and stay "no data".
          PIPELINE_SINCE: ${{ vars.PIPELINE_SINCE }}
          COMPOSITE_CONFIG: ${{ vars.COMPOSITE_CONFIG }}
        run: |
          if [ -n "$PERIOD" ]; then
            python scripts/realtime_update.py --period "$PERIOD"
          else
            python scripts/realtime_update.py
          fi

      # Publish even when the run failed: latest_status.json then says "degraded" and shows why,
      # instead of the site silently showing an old "operational".
      #
      # With Supabase configured the big derived files (village history, baselines, district series,
      # GeoJSON) live in Storage and are NOT committed; git keeps only the pipeline's input tables,
      # manifests and the small status files. Without Supabase everything is committed as before.
      - name: Commit refreshed data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/Dashboard/latest_status.json data/processed/manifests/ data/processed/csv/ \
                  output/spi/csv/ output/spi/extra/csv/ output/indices/zonal/village/ \
                  frontend/public/data/latest_status.json
          if [ -z "$SUPABASE_URL" ]; then
            git add outputs/Dashboard/ frontend/public/data/
          fi
          if git diff --staged --quiet; then
            echo "No data changes."
          else
            git commit -m "chore(data): near-real-time update [skip ci]"
            git push
          fi

      - name: Fail the job if the pipeline failed
        if: steps.pipeline.outcome == 'failure'
        run: |
          echo "::error::scripts/realtime_update.py failed - see the 'Run near-real-time update' step and pipeline_run in latest_status.json"
          exit 1
