name: Real-Time GEE Drought Ingestion & Data Sync

on:
  schedule:
    # Sentinel-2 overpasses Latur (18.4°N, 76.6°E) at ~10:54 AM IST (05:24 UTC) along Relative Orbits R062 & R105.
    # Level-2A BOA reflectance is published to Earth Engine within 6-12 hours.
    # Scheduled runs trigger on Mondays & Thursdays at 03:00 UTC (08:30 AM IST), ensuring all latest scenes are cataloged.
    - cron: '0 3 * * 1,4'
  workflow_dispatch:
    inputs:
      period:
        description: 'Target observation period (YYYY-MM)'
        required: false
        default: 'latest'

permissions:
  contents: write

jobs:
  realtime_sync:
    name: Ingest Sentinel-2 + CHIRPS & Sync to Supabase & GitHub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Scientific & Cloud Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml scipy earthengine-api supabase pandas numpy geopandas shapely requests matplotlib

      - name: Run Pre-Integration Quality Control Tests
        run: |
          python realtime/test_realtime_pipeline.py

      - name: Execute Near-Realtime Drought Pipeline Orchestrator
        env:
          GEE_PROJECT: ${{ secrets.GEE_PROJECT }}
          GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          TARGET_PERIOD="${{ github.event.inputs.period }}"
          if [ -n "$TARGET_PERIOD" ] && [ "$TARGET_PERIOD" != "latest" ]; then
            python realtime/orchestrator.py --period "$TARGET_PERIOD"
          else
            python realtime/orchestrator.py
          fi

      - name: Commit & Push Updated Data to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/Dashboard/ frontend/public/data/
          if git diff --staged --quiet; then
            echo "No data changes detected. Skipping commit."
          else
            git commit -m "chore(data): auto-sync near-realtime satellite observation metrics [skip ci]"
            git push origin operational || git push origin main
          fi
