version: "3.9"

services:

  # ---------------------------------------------------------------
  # Local Postgres with PostGIS (optional: use Supabase cloud instead)
  # ---------------------------------------------------------------
  postgres:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: drought
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend-go/migrations:/docker-entrypoint-initdb.d:ro

  # ---------------------------------------------------------------
  # Go API
  # ---------------------------------------------------------------
  go-api:
    build:
      context: ./backend-go
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/drought?sslmode=disable
      GO_API_PORT: 8080
      ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:4000"
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  # ---------------------------------------------------------------
  # Node.js gateway
  # ---------------------------------------------------------------
  node-gateway:
    build:
      context: ./backend-node
    environment:
      NODE_GATEWAY_PORT: 4000
      GO_API_URL: http://go-api:8080
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
    ports:
      - "4000:4000"
    depends_on:
      - go-api

volumes:
  pgdata:
