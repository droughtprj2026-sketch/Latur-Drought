version: "3.9"

services:

  # ---------------------------------------------------------------
  # Local Postgres with PostGIS (optional: use Supabase cloud instead)
  # ---------------------------------------------------------------
  postgres:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: drought
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # ---------------------------------------------------------------
  # Node.js API server
  # ---------------------------------------------------------------
  api:
    build:
      context: ./backend-node
    environment:
      PORT: 4000
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
    ports:
      - "4000:4000"
    depends_on:
      - postgres

volumes:
  pgdata:
